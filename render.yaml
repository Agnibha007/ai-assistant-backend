services:
  # Combined API and Worker Web Service (Free Tier)
  - type: web
    name: ai-assistant-combined
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: MONGODB_URL
        sync: false # Set manually in Render dashboard
      - key: MONGODB_DB_NAME
        value: assistant_db
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-assistant-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # Managed Redis (Free Tier)
  - type: redis
    name: ai-assistant-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow-all

# No 'databases' section here as we are using external MongoDB Atlas
