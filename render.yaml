services:
  # 1. API Web Service
  - type: web
    name: ai-assistant-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-assistant-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Celery Background Worker
  - type: worker
    name: ai-assistant-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-assistant-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # 3. Managed Redis
  - type: redis
    name: ai-assistant-redis
    plan: free
    ipAllowList:
      - cidrBlock: 0.0.0.0/0
        description: allow-all

# 4. Managed PostgreSQL
databases:
  - name: ai-assistant-db
    plan: free
